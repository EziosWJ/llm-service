[project]
name = "llm-service"
version = "0.1.0"
description = "Material-aware LLM service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "jinja2>=3.1.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "openai>=1.40.0",
  "qdrant-client>=1.10.0",
  "sentence-transformers>=3.0.0",
  "python-docx>=1.1.0",
  "pypdf>=4.3.0",
  "chardet>=5.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-mock>=3.14.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
